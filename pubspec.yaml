name: ncds_voice_app_vol1
description: "AI-Assisted Remote Patient Monitoring & Medication Adherence System"
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.3
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  google_generative_ai: ^0.4.6
  flutter_tts: ^4.2.0
  speech_to_text: ^7.4.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  shared_preferences: ^2.5.2
  intl: ^0.19.0
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.2
  uuid: ^4.3.3
  path: ^1.9.0
  http: ^1.2.0
  url_launcher: ^6.3.2
  provider: ^6.1.1
  pdf: ^3.10.8
  printing: ^5.13.0
  record: ^7.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env
